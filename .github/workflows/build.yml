name: Build

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-glibc217:
    name: Linux x86_64 (glibc 2.17)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang cmake make \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libfontconfig1-dev libfreetype6-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev \
            libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-glibc217

      - name: Build (glibc 2.17)
        env:
          # Host X11/wayland development libraries are newer than glibc 2.17.
          # Allow their undefined GLIBC_2.2x references at link time; the
          # produced binary itself is verified to require no symbol newer than
          # GLIBC_2.17, and at runtime the target system provides its own
          # glibc-2.17-compatible libxkbcommon/libX11.
          RUSTFLAGS: "-C link-arg=-Wl,--allow-shlib-undefined"
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.17

      - name: Verify glibc symbol version
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-gnu/release/sticky-desk
          echo "Binary: $BIN"
          MAX=$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "Maximum required GLIBC version: $MAX"
          if [ "$(printf '%s\n2.17\n' "$MAX" | sort -V | tail -1)" != "2.17" ]; then
            echo "::error::sticky-desk requires GLIBC_$MAX which is newer than GLIBC_2.17"
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/sticky-desk dist/sticky-desk-linux-x86_64-glibc2.17
          strip dist/sticky-desk-linux-x86_64-glibc2.17 || true

      - uses: actions/upload-artifact@v4
        with:
          name: sticky-desk-linux-x86_64-glibc2.17
          path: dist/sticky-desk-linux-x86_64-glibc2.17

  windows:
    name: Windows x86_64 (zigbuild)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW resource compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Build
        run: cargo zigbuild --release --target x86_64-pc-windows-gnu

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/sticky-desk.exe dist/sticky-desk-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: sticky-desk-windows-x86_64
          path: dist/sticky-desk-windows-x86_64.exe

  macos:
    name: macOS arm64 (native)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/sticky-desk dist/sticky-desk-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: sticky-desk-macos-arm64
          path: dist/sticky-desk-macos-arm64

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-glibc217, windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
