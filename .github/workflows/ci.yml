name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  linux-glibc217:
    name: Linux ${{ matrix.arch }} (glibc 2.17)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang cmake make \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libfontconfig1-dev libfreetype6-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev \
            libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-glibc217-${{ matrix.arch }}

      - name: Build (glibc 2.17)
        env:
          # Host X11/wayland development libraries are newer than glibc 2.17.
          # Allow their undefined GLIBC_2.2x references at link time; the
          # produced binary itself is verified to require no symbol newer than
          # GLIBC_2.17, and at runtime the target system provides its own
          # glibc-2.17-compatible libxkbcommon/libX11.
          RUSTFLAGS: "-C link-arg=-Wl,--allow-shlib-undefined"
        run: cargo zigbuild --release --target ${{ matrix.target }}.2.17

      - name: Verify glibc symbol version
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/sticky-desk
          echo "Binary: $BIN"
          MAX=$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "Maximum required GLIBC version: $MAX"
          if [ "$(printf '%s\n2.17\n' "$MAX" | sort -V | tail -1)" != "2.17" ]; then
            echo "::error::sticky-desk requires GLIBC_$MAX which is newer than GLIBC_2.17"
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/sticky-desk
          NAME=sticky-desk-linux-${{ matrix.arch }}-glibc2.17
          BUNDLE=dist/sticky-desk-linux-${{ matrix.arch }}
          mkdir -p "$BUNDLE/share/applications"
          cp "$BIN" "$BUNDLE/sticky-desk"
          strip "$BUNDLE/sticky-desk" || true
          cp assets/linux/sticky-desk.desktop "$BUNDLE/share/applications/"
          for s in 16 32 48 64 128 256; do
            dir="$BUNDLE/share/icons/hicolor/${s}x${s}/apps"
            mkdir -p "$dir"
            cp "assets/linux/sticky-desk-${s}.png" "$dir/sticky-desk.png"
          done
          cp "$BIN" "dist/$NAME"
          strip "dist/$NAME" || true
          tar -C dist -czf "dist/$NAME.tar.gz" "sticky-desk-linux-${{ matrix.arch }}"
          rm -rf "$BUNDLE"

      - uses: actions/upload-artifact@v4
        with:
          name: sticky-desk-linux-${{ matrix.arch }}-glibc2.17
          path: |
            dist/sticky-desk-linux-${{ matrix.arch }}-glibc2.17
            dist/sticky-desk-linux-${{ matrix.arch }}-glibc2.17.tar.gz

  linux-latest:
    name: Linux ${{ matrix.arch }} (latest glibc)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang cmake make \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libfontconfig1-dev libfreetype6-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev \
            libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-latest-${{ matrix.arch }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/sticky-desk
          NAME=sticky-desk-linux-${{ matrix.arch }}-glibc-latest
          BUNDLE=dist/sticky-desk-linux-${{ matrix.arch }}
          mkdir -p "$BUNDLE/share/applications"
          cp "$BIN" "$BUNDLE/sticky-desk"
          strip "$BUNDLE/sticky-desk" || true
          cp assets/linux/sticky-desk.desktop "$BUNDLE/share/applications/"
          for s in 16 32 48 64 128 256; do
            dir="$BUNDLE/share/icons/hicolor/${s}x${s}/apps"
            mkdir -p "$dir"
            cp "assets/linux/sticky-desk-${s}.png" "$dir/sticky-desk.png"
          done
          cp "$BIN" "dist/$NAME"
          strip "dist/$NAME" || true
          tar -C dist -czf "dist/$NAME.tar.gz" "sticky-desk-linux-${{ matrix.arch }}"
          rm -rf "$BUNDLE"

      - uses: actions/upload-artifact@v4
        with:
          name: sticky-desk-linux-${{ matrix.arch }}-glibc-latest
          path: |
            dist/sticky-desk-linux-${{ matrix.arch }}-glibc-latest
            dist/sticky-desk-linux-${{ matrix.arch }}-glibc-latest.tar.gz

  windows:
    name: Windows ${{ matrix.arch }} (native)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}-msvc

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --target ${{ matrix.target }} 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          tail -n 200 build.log > build-tail.txt
          {
            echo '### Build output'
            echo '```'
            cat build-tail.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            grep -E 'error\[|error:|panicked|could not compile|failed to run custom build' build-tail.txt || true
            tail -n 5 build-tail.txt
          } > build-errors.txt
          python3 - <<'PY'
          text = open('build-errors.txt', encoding='utf-8', errors='replace').read()
          text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print(f'::error title=Build output::{text}')
          PY

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/sticky-desk.exe" "dist/sticky-desk-windows-${{ matrix.arch }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: sticky-desk-windows-${{ matrix.arch }}
          path: dist/sticky-desk-windows-${{ matrix.arch }}.exe

  macos:
    name: macOS arm64 (native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Build
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        run: |
          tail -n 200 build.log > build-tail.txt
          {
            echo '### Build output'
            echo '```'
            cat build-tail.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            grep -E 'error\[|error:|panicked|could not compile|failed to run custom build' build-tail.txt || true
            tail -n 5 build-tail.txt
          } > build-errors.txt
          python3 - <<'PY'
          text = open('build-errors.txt', encoding='utf-8', errors='replace').read()
          text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print(f'::error title=Build output::{text}')
          PY

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/sticky-desk dist/sticky-desk-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: sticky-desk-macos-arm64
          path: dist/sticky-desk-macos-arm64
